name: R smoke test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - name: Check locked environment
        run: Rscript -e 'renv::status()'
      - name: Run deterministic smoke tests
        run: Rscript tests/smoke_test.R
